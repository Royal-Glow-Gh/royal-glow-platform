<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Glow — Shop and Spa</title>
<meta name="description" content="Royal Glow skincare, personal care and spa products. Order online for delivery or pickup.">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#0d0d0c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1814; --ink-2:#5b564c; --muted:#8d877b; --line:#e6dfd2;
  --cream:#faf7f1; --card:#ffffff; --night:#0d0d0c; --night-2:#1b1a17;
  --gold:#c8961e; --gold-deep:#8f6a0f; --gold-soft:#f6ecd2;
  --bad:#b3261e; --good:#1f7a3a;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 var(--sans);color:var(--ink);background:var(--cream)}
a{color:var(--gold-deep)}
img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
/* header */
.top{background:var(--night);color:#efe9dc;position:sticky;top:0;z-index:10;border-bottom:1px solid #2a2721}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.top img.logo{height:40px;width:auto}
.top nav{display:flex;gap:6px;align-items:center}
.top nav a{color:#efe9dc;text-decoration:none;font-size:15px;padding:8px 12px;border-radius:999px}
.top nav a:hover{background:#ffffff14}
.top nav a.cart{background:var(--gold);color:var(--night);font-weight:600}
.top nav a.cart:hover{background:#ddb04a}
.count{display:inline-block;min-width:20px;text-align:center;margin-left:4px;font-variant-numeric:tabular-nums}
/* hero */
.hero{background:radial-gradient(1200px 400px at 70% -10%,#3b2d0b 0%,var(--night) 60%);color:#efe9dc;padding:56px 0 64px}
.hero h1{font:600 clamp(36px,5vw,56px)/1.05 var(--serif);margin:0 0 12px;color:#f7e7bf;letter-spacing:.2px}
.hero p{max-width:560px;margin:0;color:#cfc6b3;font-size:17px}
main{padding:36px 0 72px;min-height:50vh}
h2.title{font:600 32px/1.1 var(--serif);margin:0 0 20px}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease, box-shadow .15s ease}
.pcard:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(40,30,10,.08)}
.pimg{aspect-ratio:1/1;background:var(--night-2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pimg.ph{background-image:radial-gradient(circle at 50% 40%,#3a2c0a,var(--night-2) 70%)}
.pimg.ph img{width:38%;opacity:.9}
.pbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pname{font:600 21px/1.15 var(--serif);cursor:pointer}
.pprice{font-weight:600;font-size:17px}
.stock{font-size:13px;color:var(--muted)}
.stock.low{color:var(--gold-deep)}
.stock.out{color:var(--bad)}
/* buttons and forms */
.btn{font:600 15px var(--sans);border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 20px;cursor:pointer}
.btn:hover{background:#000}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--night)}
.btn.gold:hover{background:#ddb04a}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.pbody .btn{margin-top:auto}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--ink-2);margin-bottom:14px}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
textarea{min-height:80px;resize:vertical}
.choice{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.choice label{flex:1;min-width:180px;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;font-size:15px}
.choice label:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.choice small{display:block;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.line{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line .thumb{width:64px;height:64px;border-radius:10px;flex:none;background:var(--night-2) center/cover}
.line .grow{flex:1}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.qty button{border:0;background:none;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--ink)}
.qty span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;margin:6px 0;font-size:15px}
.sum.total{font-weight:700;font-size:19px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.msg{font-size:14px;margin-top:10px;min-height:20px}
.msg.err{color:var(--bad)}
.note{background:var(--gold-soft);border:1px solid #ecd9a6;border-radius:12px;padding:14px 16px;font-size:15px}
.muted{color:var(--muted)}
.back{display:inline-block;margin-bottom:18px;text-decoration:none;font-size:15px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:36px}
@media (max-width:760px){.detail{grid-template-columns:1fr}}
.detail .pimg{border-radius:16px;cursor:default}
.detail h1{font:600 42px/1.05 var(--serif);margin:0 0 8px}
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font:inherit;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.order{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold-deep);font-weight:600}
footer{background:var(--night);color:#a39b89;font-size:14px;padding:28px 0}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--night);color:#f7e7bf;padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<!-- Supabase connection values live in config.js (same folder). -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<header class="top">
  <div class="wrap">
    <a href="#" aria-label="Royal Glow shop home"><img class="logo" src="assets/logo.png" alt="Royal Glow"></a>
    <nav>
      <a href="#">Shop</a>
      <a href="#spa">Spa</a>
      <a href="https://royalglowgh.com/blog/">Blog</a>
      <a href="#account" id="accLink">Account</a>
      <a href="#cart" class="cart">Cart<span class="count" id="cartCount">0</span></a>
    </nav>
  </div>
</header>

<section class="hero" id="hero">
  <div class="wrap">
    <h1>Skincare with a royal glow</h1>
    <p>Body butters, oils and spa care made by Royal Glow. Order online for delivery or pickup, or <a href="#spa" style="color:#f7e7bf">book a spa treatment</a>.</p>
  </div>
</section>

<main><div class="wrap" id="view"></div></main>

<footer>
  <div class="wrap">
    <div>© <span id="yr"></span> <a href="https://royalglowgh.com/" style="color:inherit">Royal Glow Company Limited</a></div>
    <div id="footContact"></div>
  </div>
</footer>
<div class="toast" id="toast"></div>

<script>
(function(){
const $=id=>document.getElementById(id);
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='on')for(const ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else if(k==='class')e.className=attrs[k];else if(k==='style')e.setAttribute('style',attrs[k]);else if(k in e&&k!=='list')e[k]=attrs[k];else e.setAttribute(k,attrs[k]);}for(const c of kids.flat()){if(c==null||c===false)continue;e.appendChild(typeof c==='object'?c:document.createTextNode(String(c)));}return e;}
const money=v=>'GH₵ '+(Number(v)||0).toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2});
const toast=t=>{const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1800)};
$('yr').textContent=new Date().getFullYear();

const CFG=window.RG_CONFIG||{};
const cfgOk=!!CFG.SUPABASE_URL&&!/PASTE_/.test(CFG.SUPABASE_URL+CFG.SUPABASE_KEY);
const sb=cfgOk&&window.supabase?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY):null;
const here=location.origin+location.pathname;
const imgUrl=p=>p?CFG.SUPABASE_URL+'/storage/v1/object/public/product-images/'+encodeURIComponent(p):'';
let recovering=/type=recovery/.test(location.hash);

// ---------- state ----------
let CAT=[],INFO={zones:[],pickup_points:[]},USER=null,PROFILE=null,loaded=false;
const prod=id=>CAT.find(p=>p.id===id);
const CART_KEY='rg-cart';
let cart=[];try{cart=JSON.parse(localStorage.getItem(CART_KEY))||[]}catch(e){cart=[]}
const saveCart=()=>{try{localStorage.setItem(CART_KEY,JSON.stringify(cart))}catch(e){};$('cartCount').textContent=cart.reduce((s,l)=>s+l.qty,0)};
const cartLines=()=>cart.map(l=>({...l,p:prod(l.id)})).filter(l=>l.p);
const subtotal=()=>cartLines().reduce((s,l)=>s+l.qty*Number(l.p.price),0);
function addToCart(id,n=1){const p=prod(id);if(!p)return;const l=cart.find(x=>x.id===id);const cur=l?l.qty:0;
  const max=Math.floor(Number(p.available));if(cur+n>max){toast(max?'Only '+max+' available':'Sold out');return}
  if(l)l.qty+=n;else cart.push({id,qty:n});saveCart();toast('Added to cart');}

async function load(){
  if(!sb){$('view').replaceChildren(h('div',{class:'panel'},'The shop is being set up. Please check back soon.'));return}
  try{
    const [c,i]=await Promise.all([sb.rpc('shop_catalog'),sb.rpc('shop_info')]);
    if(c.error)throw c.error;CAT=c.data||[];INFO=(i.data)||INFO;
  }catch(e){$('view').replaceChildren(h('div',{class:'panel'},'We could not load the shop just now. Please refresh the page.'));return}
  cart=cart.filter(l=>prod(l.id));saveCart();
  const contact=[];if(INFO.whatsapp)contact.push('WhatsApp '+INFO.whatsapp);
  $('footContact').textContent=contact.join(' · ');
  const {data:{session}}=await sb.auth.getSession();await setUser(session&&session.user);
  loaded=true;route();
}
async function setUser(u){
  USER=u||null;PROFILE=null;
  if(USER){const {data}=await sb.from('shop_profiles').select('*').eq('user_id',USER.id).maybeSingle();PROFILE=data||null}
  $('accLink').textContent=USER?(PROFILE&&PROFILE.full_name?PROFILE.full_name.split(' ')[0]:'My account'):'Account';
}
if(sb)sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;setTimeout(()=>{location.hash='account';route()},0)}});

// ---------- router ----------
function route(){
  if(!loaded)return;
  const hsh=decodeURIComponent(location.hash.slice(1));
  const [page,arg]=hsh.split('/');
  $('hero').classList.toggle('hidden',!(page===''||page==='shop'||/access_token|type=/.test(hsh)));
  window.scrollTo(0,0);
  if(recovering)return viewAccount();
  if(page==='p')return viewProduct(arg);
  if(page==='cart')return viewCart();
  if(page==='checkout')return viewCheckout();
  if(page==='done')return viewDone(arg);
  if(page==='account')return viewAccount();
  if(page==='spa')return arg?viewSpaBook(arg):viewSpa();
  if(page==='spadone')return viewSpaDone(arg);
  viewShop();
}
window.addEventListener('hashchange',route);

// ---------- views ----------
function pimg(p,big){
  const d=h('div',{class:'pimg'+(p.image_path?'':' ph'),on:big?{}:{click:()=>location.hash='p/'+p.id}});
  if(p.image_path)d.style.backgroundImage='url("'+imgUrl(p.image_path)+'")';else d.appendChild(h('img',{src:'assets/crown.png',alt:''}));
  return d;
}
function stockText(p){const a=Math.floor(Number(p.available));
  if(a<=0)return h('div',{class:'stock out'},'Sold out');
  if(a<=5)return h('div',{class:'stock low'},'Only '+a+' left');
  return h('div',{class:'stock'},'In stock');}
function viewShop(){
  const v=$('view');
  if(!CAT.length){v.replaceChildren(h('div',{class:'panel'},'New products are coming soon.'));return}
  v.replaceChildren(h('h2',{class:'title'},'Our products'),
    h('div',{class:'grid'},CAT.map(p=>h('div',{class:'pcard'},pimg(p),
      h('div',{class:'pbody'},h('div',{class:'pname',on:{click:()=>location.hash='p/'+p.id}},p.name),
        h('div',{class:'pprice'},money(p.price)),stockText(p),
        h('button',{class:'btn',disabled:Number(p.available)<1,on:{click:()=>addToCart(p.id)}},Number(p.available)<1?'Sold out':'Add to cart'))))));
}
function viewProduct(id){
  const p=prod(id);if(!p)return viewShop();
  let n=1;const max=Math.floor(Number(p.available));
  const cnt=h('span',null,'1');
  const qty=h('div',{class:'qty'},h('button',{'aria-label':'Fewer',on:{click:()=>{n=Math.max(1,n-1);cnt.textContent=n}}},'−'),cnt,h('button',{'aria-label':'More',on:{click:()=>{n=Math.min(Math.max(max,1),n+1);cnt.textContent=n}}},'+'));
  $('view').replaceChildren(h('a',{href:'#',class:'back'},'← All products'),
    h('div',{class:'detail'},pimg(p,true),
      h('div',null,h('h1',null,p.name),h('div',{class:'pprice',style:'font-size:22px;margin-bottom:6px'},money(p.price)),stockText(p),
        p.description?h('p',{style:'color:var(--ink-2);margin:18px 0'},p.description):h('div',{style:'height:18px'}),
        h('div',{style:'display:flex;gap:12px;align-items:center;flex-wrap:wrap'},qty,
          h('button',{class:'btn gold',disabled:max<1,on:{click:()=>addToCart(p.id,n)}},max<1?'Sold out':'Add to cart'),
          h('a',{href:'#cart',class:'btn ghost',style:'text-decoration:none'},'View cart')))));
}
function viewCart(){
  const lines=cartLines();const v=$('view');
  if(!lines.length){v.replaceChildren(h('h2',{class:'title'},'Your cart'),h('div',{class:'panel'},'Your cart is empty. ',h('a',{href:'#'},'Browse products')));return}
  const rows=lines.map(l=>{const max=Math.floor(Number(l.p.available));
    const th=h('div',{class:'thumb'});if(l.p.image_path)th.style.backgroundImage='url("'+imgUrl(l.p.image_path)+'")';
    return h('div',{class:'line'},th,h('div',{class:'grow'},h('div',{style:'font-weight:600'},l.p.name),h('div',{class:'muted',style:'font-size:14px'},money(l.p.price)+' each')),
      h('div',{class:'qty'},h('button',{on:{click:()=>{const c=cart.find(x=>x.id===l.id);c.qty--;if(c.qty<1)cart=cart.filter(x=>x!==c);saveCart();viewCart()}}},'−'),h('span',null,l.qty),
        h('button',{on:{click:()=>{const c=cart.find(x=>x.id===l.id);if(c.qty+1>max){toast('Only '+max+' available');return}c.qty++;saveCart();viewCart()}}},'+')),
      h('div',{style:'min-width:100px;text-align:right;font-weight:600'},money(l.qty*l.p.price)))});
  v.replaceChildren(h('h2',{class:'title'},'Your cart'),
    h('div',{class:'two'},h('div',{class:'panel'},rows),
      h('div',{class:'panel'},h('div',{class:'sum total',style:'border:0;margin:0;padding:0'},h('span',null,'Subtotal'),h('span',null,money(subtotal()))),
        h('p',{class:'muted',style:'font-size:14px'},'Delivery or pickup is chosen at checkout.'),
        h('button',{class:'btn gold full',on:{click:()=>location.hash='checkout'}},'Checkout'))));
}
function viewCheckout(){
  const lines=cartLines();if(!lines.length){location.hash='cart';return}
  const pts=INFO.pickup_points||[];const zones=INFO.zones||[];
  const f={name:h('input',{autocomplete:'name',value:(PROFILE&&PROFILE.full_name)||''}),phone:h('input',{type:'tel',autocomplete:'tel',value:(PROFILE&&PROFILE.phone)||''}),
    email:h('input',{type:'email',autocomplete:'email',value:(USER&&USER.email)||''}),address:h('textarea',{value:(PROFILE&&PROFILE.address)||'',placeholder:'Area, street, landmark, city'}),
    pickup:h('select',null,pts.map(p=>h('option',{value:p.id},p.name))),
    zone:h('select',null,h('option',{value:'',disabled:true,selected:true},'Choose your area'),zones.map(z=>h('option',{value:z.id},z.name+' — '+(Number(z.fee)?money(z.fee):'free')+(z.fee_to_rider?' (pay the rider)':''))),h('option',{value:'other'},'Somewhere else — we\'ll call to confirm the fee')),notes:h('textarea',{placeholder:'Anything we should know (optional)',style:'min-height:60px'})};
  const radio=(name,val,checked,title,sub)=>h('label',null,h('input',{type:'radio',name,value:val,checked}),h('span',null,title,sub?h('small',null,sub):''));
  const del=h('div',{class:'choice'},radio('dm','delivery',true,'Delivery','Fee depends on your area'),pts.length?radio('dm','pickup',false,'Pick up','Collect at a Royal Glow shop, free'):'');
  const pay=h('div',{class:'choice'},radio('pm','momo',true,'Mobile Money','Pay to our MoMo number after ordering'),radio('pm','cash',false,'Cash','Pay on delivery or at pickup'));
  const zoneBox=h('label',{class:'f'},'Delivery area',f.zone);
  const addrBox=h('label',{class:'f'},'Delivery address',f.address),pickBox=h('label',{class:'f hidden'},'Pickup point',f.pickup);
  const sumBox=h('div');const msg=h('div',{class:'msg err'});
  const dm=()=>(del.querySelector('input:checked')||{}).value||'delivery';
  const zoneSel=()=>zones.find(z=>z.id===f.zone.value);
  const upd=()=>{const d=dm()==='delivery';[zoneBox,addrBox].forEach(b=>b.classList.toggle('hidden',!d));pickBox.classList.toggle('hidden',d);
    const z=zoneSel();let label,ff=0;
    if(!d)label='Free';
    else if(!f.zone.value)label='Choose your area';
    else if(f.zone.value==='other')label='To be confirmed';
    else if(z.fee_to_rider)label=money(z.fee)+' (pay the rider)';
    else{ff=Number(z.fee)||0;label=ff?money(ff):'Free'}
    sumBox.replaceChildren(...lines.map(l=>h('div',{class:'sum'},h('span',null,l.qty+' × '+l.p.name),h('span',null,money(l.qty*l.p.price)))),
      h('div',{class:'sum'},h('span',null,d?'Delivery':'Pickup'),h('span',null,label)),h('div',{class:'sum total'},h('span',null,'Total'),h('span',null,money(subtotal()+ff))),
      d&&f.zone.value==='other'?h('p',{class:'muted',style:'font-size:13px;margin:6px 0 0'},'We\'ll call you with the delivery fee before you pay.'):'');};
  const clr=()=>{msg.textContent=''};
  del.addEventListener('change',()=>{clr();upd()});f.zone.addEventListener('change',()=>{clr();upd()});upd();
  const go=h('button',{class:'btn gold full',on:{click:async()=>{
    msg.textContent='';if(!f.name.value.trim()||!f.phone.value.trim()){msg.textContent='Please give your name and phone number.';return}
    if(dm()==='delivery'&&!f.zone.value){msg.textContent='Please choose your delivery area.';return}
    if(dm()==='delivery'&&!f.address.value.trim()){msg.textContent='Please give a delivery address.';return}
    go.disabled=true;go.textContent='Placing order…';
    const {data,error}=await sb.rpc('place_order',{p_items:cart.map(l=>({item_id:l.id,qty:l.qty})),p_name:f.name.value,p_phone:f.phone.value,p_email:f.email.value,
      p_delivery_method:dm(),p_address:f.address.value,p_pickup_location:dm()==='pickup'?f.pickup.value:null,p_payment_method:pay.querySelector('input:checked').value,p_notes:f.notes.value,
      p_zone:dm()==='delivery'&&f.zone.value!=='other'?f.zone.value:null});
    if(error){go.disabled=false;go.textContent='Place order';msg.textContent=(error.message||'Something went wrong.').replace(/^.*?ERROR:\s*/,'');
      const r=await sb.rpc('shop_catalog');if(!r.error)CAT=r.data;return}
    try{sessionStorage.setItem('rg-last-order',JSON.stringify({...data,payment:pay.querySelector('input:checked').value,phone:f.phone.value}))}catch(e){}
    cart=[];saveCart();const r=await sb.rpc('shop_catalog');if(!r.error)CAT=r.data;
    location.hash='done/'+data.order_no;}}},'Place order');
  $('view').replaceChildren(h('a',{href:'#cart',class:'back'},'← Back to cart'),h('h2',{class:'title'},'Checkout'),
    h('div',{class:'two'},

// ---------- spa ----------
const TZ='Africa/Accra';   // Ghana: GMT all year
const hm=t=>new Date(t).toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
const dayName=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short'});
const longWhen=t=>new Date(t).toLocaleDateString('en-GB',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'})+' at '+hm(t);
const addDays=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
let SPA=null;
async function loadSpa(){if(SPA)return SPA;const {data,error}=await sb.rpc('spa_info');if(error)throw error;SPA=data;return SPA;}
const mins=n=>n>=60?(Math.floor(n/60)+' hr'+(n%60?' '+(n%60)+' min':'')):n+' min';
async function viewSpa(){
  const v=$('view');v.replaceChildren(h('p',{class:'muted'},'Loading treatments…'));

      h('div',{class:'grid'},SPA.services.filter(s=>s.category===c).map(s=>h('div',{class:'pcard'},h('div',{class:'pbody'},
        h('div',{class:'pname'},s.name),h('div',{class:'stock'},mins(s.duration_min)),h('div',{class:'pprice'},money(s.price)),
        s.description?h('div',{style:'font-size:14px;color:var(--ink-2)'},s.description):'',

async function viewSpaBook(id){
  const v=$('view');try{await loadSpa()}catch(e){return viewSpa()}

  const days=[];for(let i=0;i<=Math.min(SPA.max_days_ahead,27);i++){const d=addDays(SPA.today,i);days.push(d)}

      h('div',{style:'display:flex;flex-wrap:wrap;gap:8px'},times.map(t=>h('button',{class:'btn ghost',style:'padding:8px 14px',on:{click:e=>{slot=t;slotBox.querySelectorAll('button').forEach(b=>{b.className='btn ghost'});e.currentTarget.className='btn gold';

    on:{click:()=>{day=d;dayBox.querySelectorAll('button').forEach(x=>{if(!x.disabled)x.className='btn ghost'});b.className='btn';b.style.cssText='flex:none;padding:8px 14px';loadSlots()}}},d===SPA.today?'Today':dayName(d));dayBox.appendChild(b)});
  thSel.addEventListener('change',()=>{if(day)loadSlots()});
  const f={name:h('input',{autocomplete:'name',value:(PROFILE&&PROFILE.full_name)||''}),phone:h('input',{type:'tel',autocomplete:'tel',value:(PROFILE&&PROFILE.phone)||''}),
    email:h('input',{type:'email',autocomplete:'email',value:(USER&&USER.email)||''}),notes:h('textarea',{placeholder:'Anything we should know, e.g. allergies or sensitive skin (optional)',style:'min-height:60px'})};
  const summary=h('div',{class:'note',style:'margin-bottom:14px'});
  const go=h('button',{class:'btn gold full',on:{click:async()=>{msg.textContent='';
    if(!f.name.value.trim()||!f.phone.value.trim()){msg.textContent='Please give your name and phone number.';return}
    go.disabled=true;go.textContent='Booking…';
    const {data,error}=await sb.rpc('book_spa',{p_service:s.id,p_starts_at:slot,p_therapist:thSel.value||null,p_name:f.name.value,p_phone:f.phone.value,p_email:f.email.value,p_notes:f.notes.value,p_staff:false});
    go.disabled=false;go.textContent='Confirm booking';
    if(error){msg.textContent=(error.message||'Something went wrong.').replace(/^.*?ERROR:\s*/,'');loadSlots();return}
    try{sessionStorage.setItem('rg-last-spa',JSON.stringify(data))}catch(e){}
    location.hash='spadone/'+data.booking_no;}}},'Confirm booking');
  form.replaceChildren(h('div',{class:'panel'},summary,h('label',{class:'f'},'Full name',f.name),h('label',{class:'f'},'Phone number',f.phone),h('label',{class:'f'},'Email (optional)',f.email),h('label',{class:'f'},'Notes',f.notes),
    USER?'':h('p',{class:'muted',style:'font-size:14px;margin:0 0 12px'},h('a',{href:'#account'},'Sign in'),' to see and manage your bookings later.'),go,msg));
  v.replaceChildren(h('a',{href:'#spa',class:'back'},'← All treatments'),h('h2',{class:'title',style:'margin-bottom:4px'},s.name),
    h('p',{class:'muted',style:'margin-top:0'},mins(s.duration_min)+' · '+money(s.price)+(s.description?' · '+s.description:'')),
    h('div',{class:'panel'},h('label',{class:'f',style:'max-width:320px'},'Therapist',thSel),h('div',{style:'font-size:14px;color:var(--ink-2);margin-bottom:8px'},'Choose a day'),dayBox,slotBox),form);
}

  const v=$('view');const msg=h('div',{class:'msg'});
  const setMsg=(t,err)=>{msg.textContent=t;msg.className='msg'+(err?' err':'')};

        h('button',{class:'btn gold full',on:{click:async()=>{setMsg('Signing in…');const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});

        h('p',{style:'font-size:14px;margin:12px 0 0'},h('a',{href:'#account',on:{click:async e=>{e.preventDefault();if(!email.value.trim())return setMsg('Type your email above first.',true);

        h('button',{class:'btn gold full',on:{click:async()=>{if(!name.value.trim()||!email.value.trim())return setMsg('Please give your name and email.',true);

const SPASTATUS={booked:'Booked',confirmed:'Confirmed',completed:'Completed',cancelled:'Cancelled',no_show:'Missed'};
async function loadMyBookings(box){
  const {data,error}=await sb.from('spa_bookings').select('booking_no,service_name,starts_at,status,price').eq('customer_user_id',USER.id).order('starts_at',{ascending:false});

  if(!data.length){box.replaceChildren(h('p',{class:'muted'},'No spa bookings yet. ',h('a',{href:'#spa'},'Book a treatment')));return}
  const now=Date.now();
  box.replaceChildren(...data.map(b=>{const m=h('div',{class:'msg err'});const canCancel=['booked','confirmed'].includes(b.status)&&Date.parse(b.starts_at)>now;
    return h('div',{class:'order'},h('div',{style:'display:flex;justify-content:space-between;gap:8px'},h('b',null,b.service_name.replace(' (sample)','')),h('span',{class:'badge'},SPASTATUS[b.status]||b.status)),
      h('div',{class:'muted',style:'font-size:14px'},longWhen(b.starts_at)+' · '+b.booking_no),
      canCancel?h('button',{class:'btn ghost',style:'margin-top:8px;padding:6px 14px;font-size:14px',on:{click:async e=>{const btn=e.currentTarget;
        if(!btn.dataset.arm){btn.dataset.arm=1;btn.textContent='Tap again to cancel';return}
        const {error}=await sb.rpc('cancel_my_spa_booking',{p_booking_no:b.booking_no});if(error){m.textContent=error.message;return}loadMyBookings(box)}}},'Cancel booking'):'',m)}));
