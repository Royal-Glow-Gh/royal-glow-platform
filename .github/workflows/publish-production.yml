name: Publish production app

on:
  push:
    branches: [main]
    paths: ['apps/production/**', '.github/workflows/publish-production.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy apps/production to the deploy-production branch
        run: |
          git subtree split --prefix apps/production -b deploy-production
          git push -f origin deploy-production
